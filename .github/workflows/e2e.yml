name: e2e corrente (S0.9)

on:
  pull_request:
    paths:
      - "scripts/e2e/**"
      - "scripts/instancia-teste/**"
      - "workers/coleta/**"
      - "workers/sympla/**"
      - "supabase/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "scripts/e2e/**"
      - "scripts/instancia-teste/**"
      - "workers/coleta/**"
      - "workers/sympla/**"
      - "supabase/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  corrente:
    name: corrente
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0

      - run: pnpm install --frozen-lockfile

      - name: pnpm e2e:esqueleto (pilha isolada, nunca o banco de demonstração)
        run: pnpm e2e:esqueleto
