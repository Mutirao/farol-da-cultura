packages:
  - packages/*
  - apps/*

# Versões compartilhadas (V14: TypeScript ~6.0.3, fixado pelo Expo SDK 58).
catalog:
  typescript: ~6.0.3
  react: 19.3.0
  vitest: 5.1.0
  zod: 4.6.7
  "@types/node": 26.6.6

# pnpm 12 (V16): só pacotes listados aqui podem rodar scripts de instalação.
allowBuilds: {}

minimumReleaseAgeExclude:
  - "@biomejs/biome@2.6.7"
  - "@biomejs/cli-android-arm64@2.6.7"
  - "@biomejs/cli-android-x64@2.6.7"
  - "@biomejs/cli-darwin-arm64@2.6.7"
  - "@biomejs/cli-darwin-x64@2.6.7"
  - "@biomejs/cli-linux-arm64-musl@2.6.7"
  - "@biomejs/cli-linux-arm64@2.6.7"
  - "@biomejs/cli-linux-x64-musl@2.6.7"
  - "@biomejs/cli-linux-x64@2.6.7"
  - "@biomejs/cli-win32-arm64@2.6.7"
  - "@biomejs/cli-win32-x64@2.6.7"
  - "@turbo/darwin-64@2.11.11"
  - "@turbo/darwin-arm64@2.11.11"
  - "@turbo/linux-64@2.11.11"
  - "@turbo/linux-arm64@2.11.11"
  - "@turbo/windows-64@2.11.11"
  - "@turbo/windows-arm64@2.11.11"
  - turbo@2.11.11
