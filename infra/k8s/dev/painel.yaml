apiVersion: apps/v1
kind: Deployment
metadata:
  name: painel
  namespace: farol-unificado-dev
  labels:
    app.kubernetes.io/name: painel
    app.kubernetes.io/part-of: farol-da-cultura
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: painel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: painel
    spec:
      containers:
        - name: painel
          image: farol-da-cultura-painel
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: painel
  namespace: farol-unificado-dev
  labels:
    app.kubernetes.io/name: painel
spec:
  selector:
    app.kubernetes.io/name: painel
  ports:
    - name: http
      port: 80
      targetPort: http
