# Dois hosts virtuais na mesma imagem (S0.8): painel administrativo e app
# web público, cada um com seu próprio docroot e fallback de SPA (histórico
# client-side do React-admin/Expo Router: qualquer rota desconhecida cai em
# index.html). Host desconhecido não serve nenhum dos dois por padrão.

server {
    listen 8080;
    server_name painel.farol.local;
    root /usr/share/nginx/html/painel;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8080;
    server_name app.farol.local;
    root /usr/share/nginx/html/app;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8080 default_server;
    server_name _;
    return 404;
}
