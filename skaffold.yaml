apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: farol-da-cultura

# Hospedagem estática única (S0.8): uma imagem (deploy/Dockerfile) serve o
# painel administrativo (apps/painel) e o export web do app público
# (apps/app), distinguidos por Host em deploy/nginx.conf — ver
# deploy/README.md para o roteiro completo e as decisões.
#
# Nesta etapa só foram executados `skaffold build --push=false`,
# `skaffold render --offline --digest-source=local` e `skaffold diagnose` —
# nenhum `skaffold run`/`dev`/`deploy`, push real de imagem ou criação de
# cluster.
#
# Fora deste arquivo (SCOPE do S0.8 é deploy/**, skaffold.yaml e
# .dockerignore): o worker de coleta (workers/coleta/Dockerfile) e o spike
# anterior só do painel (apps/painel/Dockerfile, infra/k8s/**) não são
# construídos/implantados por este skaffold.yaml. Ver "Relação com
# infra/k8s/" em deploy/README.md.
build:
  artifacts:
    - image: farol-web
      context: .
      docker:
        dockerfile: deploy/Dockerfile
  local:
    push: false
    useBuildkit: true

manifests:
  kustomize:
    paths:
      - deploy/k8s

deploy:
  kubectl: {}
